plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.plugin.compose' }
def configRoot = providers.environmentVariable('SAATHI_CONFIG_ROOT_PUBLIC_JWK').orElse('{}').get()
def bootstrap = providers.environmentVariable('SAATHI_CONFIG_BOOTSTRAP').orElse('').get()
def quote = { value -> groovy.json.JsonOutput.toJson(value) }
def brandName = providers.environmentVariable('SWARM_BRAND_NAME').orElse('CJP Swarm').get()
def qaFields = ['SAATHI_QA_KEYSTORE', 'SAATHI_QA_STORE_PASSWORD', 'SAATHI_QA_KEY_ALIAS', 'SAATHI_QA_KEY_PASSWORD']
def hasQaSigner = qaFields.any { System.getenv(it) }
if (hasQaSigner && !qaFields.every { System.getenv(it) })
    throw new GradleException('Persistent QA signing requires all four SAATHI_QA signing variables.')
android {
    namespace 'org.saathi.android'
    compileSdk { version = release(37) { minorApiLevel = 0 } }
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'org.saathi.android'
        minSdk 26
        targetSdk 36
        // 1.0.0 is the build for the 9-10 Oct 2026 event, the same on iPhone. Keep QA updates installable over
        // the same package: increment versionCode on every build.
        versionCode 14
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'CONFIG_ROOT', quote(configRoot)
        buildConfigField 'String', 'BOOTSTRAP', quote(bootstrap)
        buildConfigField 'String', 'BRAND_NAME', quote(brandName)
        buildConfigField 'String', 'BRAND_DISPLAY', quote(providers.environmentVariable('SWARM_BRAND_DISPLAY').orElse('SWARM').get())
        buildConfigField 'String', 'BRAND_BYLINE', quote(providers.environmentVariable('SWARM_BRAND_BYLINE').orElse('by CJP').get())
        buildConfigField 'boolean', 'CHAT_ENABLED', 'false'
        resValue 'string', 'app_name', brandName
    }
    signingConfigs {
        qa {
            if (hasQaSigner) {
                storeFile file(System.getenv('SAATHI_QA_KEYSTORE'))
                storePassword System.getenv('SAATHI_QA_STORE_PASSWORD')
                keyAlias System.getenv('SAATHI_QA_KEY_ALIAS')
                keyPassword System.getenv('SAATHI_QA_KEY_PASSWORD')
            }
        }
        release {
            if (System.getenv('SAATHI_RELEASE_KEYSTORE')) {
                storeFile file(System.getenv('SAATHI_RELEASE_KEYSTORE'))
                storePassword System.getenv('SAATHI_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('SAATHI_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('SAATHI_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'CHAT_ENABLED', 'true'
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            buildConfigField 'String', 'ENVIRONMENT', '"development"'
            resValue 'string', 'app_name', "${brandName} Dev"
        }
        staging {
            buildConfigField 'boolean', 'CHAT_ENABLED', 'true'
            initWith debug
            debuggable false
            signingConfig hasQaSigner ? signingConfigs.qa : signingConfigs.debug
            applicationIdSuffix '.qa'
            matchingFallbacks = ['debug']
            buildConfigField 'String', 'ENVIRONMENT', '"staging"'
            resValue 'string', 'app_name', brandName
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'ENVIRONMENT', '"production"'
        }
    }
    buildFeatures { compose true; buildConfig true; resValues true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources.excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'] }
}
tasks.configureEach {
    if (name in ['assembleStaging', 'bundleStaging']) doFirst {
        if (configRoot == '{}' || !bootstrap.startsWith('https://'))
            throw new GradleException('Staging requires its configuration trust anchor and HTTPS bootstrap.')
    }
    if (name in ['assembleRelease', 'bundleRelease']) doFirst {
        if (!System.getenv('SAATHI_RELEASE_KEYSTORE') || configRoot == '{}' || !bootstrap.startsWith('https://'))
            throw new GradleException('Release requires an external keystore and production configuration trust anchor/bootstrap.')
    }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.github.erdtman:java-json-canonicalization:1.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.google.android.gms:play-services-nearby:19.5.1'
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    implementation 'androidx.media3:media3-transformer:1.11.1'
    implementation 'androidx.media3:media3-effect:1.11.1'
    implementation 'androidx.media3:media3-common:1.11.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
