name: Saathi verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saathi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saathi
          POSTGRES_PASSWORD: saathi_local
          POSTGRES_DB: saathi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saathi"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cp .env.example .env
      - run: node scripts/check-publish.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build:packages
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm test:integration
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm test:e2e
        env:
          STORAGE_PROVIDER: local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  android-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install probe SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build and lint synthetic transport probe
        working-directory: spikes/android
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: saathi-android-transport-probe
          path: spikes/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
