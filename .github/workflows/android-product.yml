name: Saathi Android product
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saathi-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      qa_ready: ${{ steps.qa-signing.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Product build, lint and cross-language protocol tests
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keystore and encrypted-storage instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          working-directory: apps/android
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Prepare persistent QA signer
        id: qa-signing
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')) && github.event_name != 'pull_request' && vars.SAATHI_STAGING_CONFIG_ROOT_PUBLIC_JWK != '' && vars.SAATHI_STAGING_CONFIG_BOOTSTRAP != ''
        env:
          QA_KEYSTORE_BASE64: ${{ secrets.SAATHI_QA_KEYSTORE_BASE64 }}
          QA_STORE_PASSWORD: ${{ secrets.SAATHI_QA_STORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.SAATHI_QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.SAATHI_QA_KEY_PASSWORD }}
        run: |
          if [ -z "$QA_KEYSTORE_BASE64" ] || [ -z "$QA_STORE_PASSWORD" ] || [ -z "$QA_KEY_ALIAS" ] || [ -z "$QA_KEY_PASSWORD" ]; then
            echo 'Staging distribution requires a persistent QA signer; artifact skipped.'
            exit 0
          fi
          umask 077
          printf '%s' "$QA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/saathi-qa.jks"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Provisioned staging APK
        if: steps.qa-signing.outputs.ready == 'true'
        working-directory: apps/android
        env:
          SAATHI_CONFIG_ROOT_PUBLIC_JWK: ${{ vars.SAATHI_STAGING_CONFIG_ROOT_PUBLIC_JWK }}
          SAATHI_CONFIG_BOOTSTRAP: ${{ vars.SAATHI_STAGING_CONFIG_BOOTSTRAP }}
          SAATHI_QA_KEYSTORE: ${{ runner.temp }}/saathi-qa.jks
          SAATHI_QA_STORE_PASSWORD: ${{ secrets.SAATHI_QA_STORE_PASSWORD }}
          SAATHI_QA_KEY_ALIAS: ${{ secrets.SAATHI_QA_KEY_ALIAS }}
          SAATHI_QA_KEY_PASSWORD: ${{ secrets.SAATHI_QA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleStaging :app:lintStaging :app:testStagingUnitTest --no-daemon
      - name: Match Android version to release tag
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: apps/android
        run: |
          version=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'/\1/p" app/build.gradle | head -n 1)
          tag_version="${GITHUB_REF_NAME#android-v}"
          test "$version" = "$tag_version" || { echo "Tag $tag_version does not match app version $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: steps.qa-signing.outputs.ready == 'true'
        with:
          name: saathi-android-qa
          path: apps/android/app/build/outputs/apk/staging/app-staging.apk
          retention-days: 7
      - name: Remove temporary QA signer
        if: always()
        run: rm -f "$RUNNER_TEMP/saathi-qa.jks"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-verification-reports
          path: apps/android/app/build/reports/
          retention-days: 7
  publish-qa-release:
    if: startsWith(github.ref, 'refs/tags/android-v') && needs.android.outputs.qa_ready == 'true'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: saathi-android-qa
          path: dist
      - name: Publish public QA pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk='dist/app-staging.apk'
          public_apk='dist/CJP-Swarm-Android-QA.apk'
          test -s "$apk"
          cp "$apk" "$public_apk"
          sha256sum "$public_apk" > "$public_apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$public_apk" "$public_apk.sha256" \
            --title "CJP Swarm Android QA $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Public staging build for testers. Package: org.saathi.android.qa. Uses the staging service and test data; not for production. Verify the APK with the attached SHA-256 file."
